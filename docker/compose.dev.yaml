services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev
    container_name: noterdam-app-dev
    env_file: ../.env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost
      APP_DOMAIN: localhost
      SESSION_SECURE_COOKIE: "false"
    ports:
      - "80:80"
    volumes:
      - ..:/app
    networks: [internal]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  db:
    image: mysql:8.0
    container_name: noterdam-db-dev
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-noterdam}
      MYSQL_USER: ${DB_USERNAME:-noterdam}
      MYSQL_PASSWORD: ${DB_PASSWORD:-noterdam}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes: [db_data:/var/lib/mysql]
    networks: [internal]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  internal:

volumes:
  db_data:
